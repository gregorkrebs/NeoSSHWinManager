name: Release Build

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload assets to, for example v1.5.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-release:
    runs-on: windows-latest

    steps:
      # Actions are pinned to full commit SHAs (the tag noted behind each):
      # a moved tag cannot change what runs with write access to releases.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Build the tagged sources. Without a ref, a manual run builds the
          # branch it was started from and uploads that to the given tag.
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: python -m pytest tests -q

      - name: Build release executables
        shell: pwsh
        run: .\build_dual.ps1

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer\NeoSSHWinManager.iss

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-executables
          path: |
            dist/NeoSSHWinManager.exe
            dist/NeoSSHWinManager-cli.exe
            dist_installer/*.exe
          if-no-files-found: error

      - name: Upload assets to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          if (-not $env:RELEASE_TAG) {
            throw 'No release tag was provided by the event payload.'
          }

          $installer = Get-ChildItem dist_installer\*.exe | Select-Object -First 1 -ExpandProperty FullName

          # sha256sums.txt lets the in-app updater verify the installer it
          # downloads (src/updater.py looks for exactly this asset name).
          $files = @('.\dist\NeoSSHWinManager.exe', '.\dist\NeoSSHWinManager-cli.exe', $installer)
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $([System.IO.Path]::GetFileName($f))"
          }
          $lines | Out-File -FilePath sha256sums.txt -Encoding ascii

          gh release upload $env:RELEASE_TAG .\dist\NeoSSHWinManager.exe .\dist\NeoSSHWinManager-cli.exe $installer .\sha256sums.txt --repo $env:GITHUB_REPOSITORY --clobber